services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: auction-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: auction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Node.js Auction Backend
  backend:
    build: .
    container_name: auction-backend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/auction
      - REDIS_URL=redis://redis:6379
      - PGUSER=postgres
      - PGPASSWORD=postgres_password
      - PGHOST=db
      - PGDATABASE=auction
      - PGPORT=5432
    depends_on:
      - db
      - redis
    volumes:
      - .:/usr/src/app:ro
      - /usr/src/app/node_modules
      - ./public/uploads:/usr/src/app/public/uploads:rw

  # 4. Frontend Static Handler (Nginx)
  frontend:
    image: nginx:alpine
    container_name: auction-frontend
    restart: always
    ports:
      - "3005:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
